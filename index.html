# Sorry-love-
Sorry and love page
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff4e50, #f857a6);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
  color: white;
  text-align: center;
}

/* Floating hearts */
.heart {
  position: absolute;
  font-size: 20px;
  opacity: 0.7;
  animation: float 6s linear infinite;
}
@keyframes float {
  0% {transform: translateY(100vh); opacity: 0;}
  50% {opacity: 1;}
  100% {transform: translateY(-10vh); opacity: 0;}
}

/* Card */
.card {
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(12px);
  padding: 35px;
  border-radius: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.35);
  display: none;
  animation: fadeIn 1.2s ease;
}
@keyframes fadeIn {
  from {opacity: 0; transform: scale(0.9);}
  to {opacity: 1; transform: scale(1);}
}

.tap {
  font-size: 1.4em;
  opacity: 0.9;
}
</style>
</head>
<body onclick="showMessage()">

<div class="tap" id="tapText">
  Tap anywhere 💗
</div>

<div class="card" id="message">
  <h1>I’m Really Sorry 😔</h1>
  <p>If I hurt you, it was never my intention 💔</p>
  <p>I love you very very much ❤️🥺</p>
  <p>Please forgive me 🌹</p>
</div>

<script>
function showMessage() {
  document.getElementById("tapText").style.display = "none";
  document.getElementById("message").style.display = "block";
}

// Hearts generator
for (let i = 0; i < 30; i++) {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "❤️";
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = (Math.random() * 3 + 4) + "s";
  document.body.appendChild(h);
}
</script>

</body>
</html>
